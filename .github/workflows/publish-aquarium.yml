name: Publish Newport Aquarium to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'aquarium/**'
      - '.github/workflows/publish-aquarium.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-newport-aquarium
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone aquarium website
        working-directory: aquarium
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify live R2 upload gateway
        run: |
          node --input-type=module <<'JS'
          const base='https://jqzdszkkrdzmedkcnpzp.supabase.co/functions/v1/newport-public-gallery';
          const req=await fetch(base+'?action=status');
          const raw=await req.text();
          console.log('Gateway status:',req.status,raw.slice(0,600));
          if(!req.ok)process.exit(1);
          const status=JSON.parse(raw);
          if(!status?.providers?.r2){console.error('R2 bucket is not reachable');process.exit(1);}
          const gallery=await fetch(base+'?action=media');
          console.log('Gallery status:',gallery.status);
          if(!gallery.ok)process.exit(1);
          JS
      - name: Test two R2 multipart chunks (18 MB), publish and clean up
        run: |
          node --input-type=module <<'JS'
          const base='https://jqzdszkkrdzmedkcnpzp.supabase.co/functions/v1/newport-public-gallery';
          async function post(action, data){
            const r=await fetch(base+'?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
            const x=await r.json();
            if(!r.ok)throw new Error(action+' HTTP '+r.status+': '+String(x.error||'unknown'));
            return x;
          }
          // Verify the actual 16 MiB R2 chunk size and a second final chunk.
          const bytes=Buffer.alloc(18*1024*1024);
          const upload=await post('start',{provider:'r2',name:'upload-system-verification.png',mime:'image/png',size:bytes.length});
          console.log('Multipart initiation:',upload.uploadId?'success':'missing uploadId','partBytes:',upload.partBytes);
          try{
            if(upload.partBytes!==16*1024*1024)throw Error('Unexpected chunk size');
            const parts=[];
            for(let partNumber=1;partNumber<=Math.ceil(bytes.length/upload.partBytes);partNumber++){
              const signed=await post('sign',{provider:'r2',key:upload.key,uploadId:upload.uploadId,partNumber});
              if(!signed.url)throw Error('Missing signed part upload URL');
              const form=new FormData();
              form.set('url',signed.url);
              const start=(partNumber-1)*upload.partBytes;
              const end=Math.min(bytes.length,start+upload.partBytes);
              form.set('chunk',new Blob([bytes.subarray(start,end)],{type:'image/png'}),'part.png');
              const req=await fetch(base+'?action=chunk',{method:'POST',body:form});
              const data=await req.json();
              if(!req.ok||!data.etag)throw Error('R2 chunk '+partNumber+' failed: '+req.status+' '+JSON.stringify(data));
              parts.push({PartNumber:partNumber,ETag:data.etag});
              console.log('Real R2 chunk',partNumber,'size:',end-start,'ETag received:',Boolean(data.etag));
            }
            const done=await post('finish',{provider:'r2',key:upload.key,uploadId:upload.uploadId,
              name:'upload-system-verification.png',mime:'image/png',size:bytes.length,
              animal:'unidentified',parts});
            if(!done.ok||!done.id)throw Error('Cloud file was not published');
            console.log('R2 multipart completion and gallery indexing:',Boolean(done.id));
            const gallery=await (await fetch(base+'?action=media')).json();
            if(!gallery.items?.some(x=>x.id===done.id))throw Error('Published test file missing from gallery');
            const deleted=await post('cleanup-test',{id:done.id});
            if(!deleted.ok)throw Error('Test media cleanup did not complete');
            console.log('Gallery test media removed:',deleted.ok);
            upload.cleanedUp=true;
          }finally{
            if(!upload.cleanedUp){
              try{
                const cleanup=await post('abort',{provider:'r2',key:upload.key,uploadId:upload.uploadId});
                console.log('Incomplete multipart upload aborted:',cleanup.ok);
              }catch(error){console.warn('Abort cleanup unavailable:',String(error));}
            }
          }
          JS
      - name: Publish without affecting Vela
        run: |
          mkdir -p docs/aq
          find docs/aq -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R aquarium/dist/. docs/aq/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/aq
          if ! git diff --cached --quiet; then
            git commit -m "build(aquarium): publish independent GitHub gallery [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
