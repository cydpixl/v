name: Publish Newport Aquarium to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'aquarium/**'
      - '.github/workflows/publish-aquarium.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-newport-aquarium
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone aquarium website
        working-directory: aquarium
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify replacement R2 API and gallery
        run: |
          node --input-type=module <<'JS'
          const base='https://newport-aquarium-r2-api.vercel.app/api';
          const headers={'Origin':'https://cydpixl.github.io'};
          const request=await fetch(base+'?action=status',{headers});
          const raw=await request.text();
          console.log('Status',request.status,raw.slice(0,700));
          if(!request.ok)throw Error('R2 API unavailable');
          const status=JSON.parse(raw);
          if(!status?.providers?.r2)throw Error('R2 API did not enable browser uploads');
          const media=await fetch(base+'?action=media',{headers});
          const gallery=await media.text();
          console.log('Gallery',media.status,gallery.slice(0,300));
          if(!media.ok||!gallery.includes('"items"'))throw Error('Gallery listing failed');
          const manage=await fetch('https://newport-aquarium-r2-api.vercel.app/api/manage?action=check',{
            method:'POST',headers:{'Origin':'https://cydpixl.github.io','Content-Type':'application/json'},
            body:'{}'});
          console.log('Classification API:',manage.status);
          if(!manage.ok)throw Error('Post-upload classification is unavailable');
          const preflight=await fetch(base+'?action=start',{method:'OPTIONS',
             headers:{Origin:'https://cydpixl.github.io','Access-Control-Request-Method':'POST',
                      'Access-Control-Request-Headers':'content-type'}});
          console.log('API preflight',preflight.status,preflight.headers.get('access-control-allow-origin'));
          if(preflight.status!==204||preflight.headers.get('access-control-allow-origin')!=='https://cydpixl.github.io')
            throw Error('CORS preflight is blocked');
          JS
      - name: Verify labeled gallery, thumbnails and duplicate scanner
        run: |
          node --input-type=module <<'JS'
          const host='https://newport-aquarium-r2-api.vercel.app';
          const gallery=await fetch(host+'/api/gallery');
          const data=await gallery.json();
          console.log('Gallery API:',gallery.status,'media:',data.items?.length);
          if(!gallery.ok||!Array.isArray(data.items))throw Error('Updated gallery API unavailable');
          const photo=data.items.find(x=>x.kind==='image'&&x.thumbnailUrl);
          if(photo){
            const thumb=await fetch(photo.thumbnailUrl,{redirect:'manual'});
            console.log('Thumbnail:',thumb.status,'optimized:',(thumb.headers.get('location')||'').includes('visitor-thumbnails'));
            if(thumb.status!==302)throw Error('Photo thumbnail could not be served');
          }
          const r=await fetch(host+'/api/dedupe?action=preview');
          const d=await r.json();
          console.log('Exact duplicate candidates:',JSON.stringify(d));
          if(!r.ok||typeof d.objects!=='number')throw Error('Duplicate scanner unavailable');
          JS
      - name: Remove only verified exact duplicates
        run: |
          node --input-type=module <<'JS'
          const base='https://newport-aquarium-r2-api.vercel.app/api/dedupe';
          let offset=0,removed=0,saved=0;
          for(let i=0;i<30;i++){
            const r=await fetch(base+'?action=cleanup&offset='+offset+'&limit=1');
            const d=await r.json();
            if(!r.ok){console.warn('Cleanup stopped:',d.error);break;}
            removed+=Number(d.removed||0);
            saved+=Number(d.bytesSaved||0);
            if(d.nextOffset===null||d.nextOffset===undefined)break;
            offset=d.nextOffset;
          }
          console.log('Verified copies removed:',removed,'bytes recovered:',saved);
          JS
      - name: Test 18 MiB multipart upload through 3 MiB gateway chunks
        run: |
          node --input-type=module <<'JS'
          const base='https://newport-aquarium-r2-api.vercel.app/api';
          const origin='https://cydpixl.github.io';
          async function post(action,data){
            const r=await fetch(base+'?action='+action,{method:'POST',
              headers:{'Content-Type':'application/json',Origin:origin},body:JSON.stringify(data)});
            const body=await r.json();if(!r.ok)throw Error(action+' '+r.status+' '+String(body.error));
            return body;
          }
          const bytes=Buffer.alloc(18*1024*1024);
          const session=await post('start',{name:'newport-archive-test.png',mime:'image/png',size:bytes.length});
          console.log('Start',session.partBytes,session.chunkSize);
          if(session.chunkSize!==3*1024*1024||session.partBytes!==12*1024*1024)throw Error('Wrong chunk sizes');
          const parts=[];
          try{
            for(let part=1;part<=2;part++){
              const begin=(part-1)*session.partBytes,end=Math.min(bytes.length,part*session.partBytes);
              const count=Math.ceil((end-begin)/session.chunkSize);
              for(let sub=0;sub<count;sub++){
                const start=begin+sub*session.chunkSize,stop=Math.min(start+session.chunkSize,end);
                const url=new URL(base);
                Object.entries({action:'chunk',key:session.key,uploadId:session.uploadId,partNumber:part,sub}).forEach(([k,v])=>url.searchParams.set(k,String(v)));
                const request=await fetch(url,{method:'POST',
                  headers:{Origin:origin,'Content-Type':'application/octet-stream'},
                  body:bytes.subarray(start,stop)});
                const out=await request.json();
                if(!request.ok||!out.ok)throw Error('Chunk upload '+part+'/'+sub+' '+request.status+' '+JSON.stringify(out));
              }
              const result=await post('commit-part',{key:session.key,uploadId:session.uploadId,partNumber:part,subCount:count});
              if(!result.etag)throw Error('Missing part ETag '+part);
              parts.push({PartNumber:part,ETag:result.etag});
              console.log('Committed part',part,'subrequests:',count);
            }
            if(parts.length!==2)throw Error('Expected two completed parts');
            console.log('18 MiB accepted by R2 multipart upload');
          }finally{
            const aborted=await post('abort',{key:session.key,uploadId:session.uploadId});
            console.log('Multipart cleanup',aborted.ok);
          }
          JS
      - name: Publish without affecting Vela
        run: |
          mkdir -p docs/aq
          find docs/aq -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R aquarium/dist/. docs/aq/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/aq
          if ! git diff --cached --quiet; then
            git commit -m "build(aquarium): publish independent GitHub gallery [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
