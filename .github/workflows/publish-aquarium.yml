name: Publish Newport Aquarium to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'aquarium/**'
      - '.github/workflows/publish-aquarium.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-newport-aquarium
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone aquarium website
        working-directory: aquarium
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish without affecting Vela
        run: |
          mkdir -p docs/aq
          find docs/aq -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R aquarium/dist/. docs/aq/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/aq
          if ! git diff --cached --quiet; then
            git commit -m "build(aquarium): publish independent GitHub gallery [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
