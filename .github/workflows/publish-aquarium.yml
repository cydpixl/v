name: Publish Newport Aquarium to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'aquarium/**'
      - '.github/workflows/publish-aquarium.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-newport-aquarium
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone aquarium website
        working-directory: aquarium
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify replacement R2 API and gallery
        run: |
          node --input-type=module <<'JS'
          const base='https://newport-aquarium-r2-api.vercel.app/api';
          const headers={'Origin':'https://cydpixl.github.io'};
          const request=await fetch(base+'?action=status',{headers});
          const raw=await request.text();
          console.log('Status',request.status,raw.slice(0,700));
          if(!request.ok)throw Error('R2 API unavailable');
          const status=JSON.parse(raw);
          if(!status?.providers?.r2)throw Error('R2 API did not enable browser uploads');
          const media=await fetch(base+'?action=media',{headers});
          const gallery=await media.text();
          console.log('Gallery',media.status,gallery.slice(0,300));
          if(!media.ok||!gallery.includes('"items"'))throw Error('Gallery listing failed');
          const preflight=await fetch(base+'?action=start',{method:'OPTIONS',
             headers:{Origin:'https://cydpixl.github.io','Access-Control-Request-Method':'POST',
                      'Access-Control-Request-Headers':'content-type'}});
          console.log('API preflight',preflight.status,preflight.headers.get('access-control-allow-origin'));
          if(preflight.status!==204||preflight.headers.get('access-control-allow-origin')!=='https://cydpixl.github.io')
            throw Error('CORS preflight is blocked');
          JS
      - name: Test direct-to-R2 18 MiB browser-style multipart upload
        run: |
          node --input-type=module <<'JS'
          const base='https://newport-aquarium-r2-api.vercel.app/api';
          async function post(action,data){
            const r=await fetch(base+'?action='+action,{method:'POST',
              headers:{'Content-Type':'application/json',Origin:'https://cydpixl.github.io'},
              body:JSON.stringify(data)});
            const raw=await r.text();let x;try{x=JSON.parse(raw)}catch{throw Error(action+' invalid response '+raw.slice(0,100));}
            if(!r.ok)throw Error(action+' '+r.status+': '+(x.error||'unknown'));
            return x;
          }
          const data=Buffer.alloc(18*1024*1024);
          const started=await post('start',{name:'smoke-test-'+Date.now()+'.png',mime:'image/png',size:data.length,provider:'r2'});
          if(!started?.uploadId||started.partBytes!==16*1024*1024)throw Error('Multipart initiation failed');
          console.log('Multipart initiated:',Boolean(started.uploadId));
          try {
            const signed=await post('sign',{provider:'r2',key:started.key,uploadId:started.uploadId,partNumber:1});
            const preflight=await fetch(signed.url,{method:'OPTIONS',headers:{
              Origin:'https://cydpixl.github.io',
              'Access-Control-Request-Method':'PUT',
              'Access-Control-Request-Headers':'content-type'
            }});
            console.log('R2 CORS preflight:',preflight.status,preflight.headers.get('access-control-allow-origin'));
            if(!preflight.ok||preflight.headers.get('access-control-allow-origin')!=='https://cydpixl.github.io')
              throw Error('R2 browser PUT blocked by CORS');
            const results=[];
            for(let partNumber=1;partNumber<=2;partNumber++){
              const url=(partNumber===1?signed:await post('sign',{provider:'r2',key:started.key,uploadId:started.uploadId,partNumber})).url;
              const start=(partNumber-1)*started.partBytes;
              const end=Math.min(started.partBytes*partNumber,data.length);
              const sent=await fetch(url,{method:'PUT',body:data.subarray(start,end),
                    headers:{Origin:'https://cydpixl.github.io','Content-Type':'application/octet-stream'}});
              console.log('R2 PUT',partNumber,sent.status,'ETag',Boolean(sent.headers.get('etag')));
              if(!sent.ok||!sent.headers.get('etag'))throw Error('Upload part '+partNumber+' failed');
              results.push({PartNumber:partNumber,ETag:sent.headers.get('etag')});
            }
            console.log('18 MiB uploaded directly to R2:',results.length,'parts');
          } finally {
            await post('abort',{provider:'r2',key:started.key,uploadId:started.uploadId});
            console.log('Multipart smoke test aborted without publishing');
          }
          JS
      - name: Publish without affecting Vela
        run: |
          mkdir -p docs/aq
          find docs/aq -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R aquarium/dist/. docs/aq/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/aq
          if ! git diff --cached --quiet; then
            git commit -m "build(aquarium): publish independent GitHub gallery [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
