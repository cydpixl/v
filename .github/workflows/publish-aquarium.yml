name: Publish Newport Aquarium to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'aquarium/**'
      - '.github/workflows/publish-aquarium.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-newport-aquarium
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone aquarium website
        working-directory: aquarium
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify live R2 upload gateway
        run: |
          node --input-type=module <<'JS'
          const base='https://jqzdszkkrdzmedkcnpzp.supabase.co/functions/v1/newport-public-gallery';
          const req=await fetch(base+'?action=status');
          const raw=await req.text();
          console.log('Gateway status:',req.status,raw.slice(0,600));
          if(raw.includes('data-appdeploy-overlay-bootstrap')){
            const appURL='https://newport-aquarium-visitor-archive-pdrkfz.v2.appdeploy.ai/';
            const html=await (await fetch(appURL)).text();
            const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)/g)].map(x=>x[1]);
            console.log('AppDeploy public scripts:',scripts.slice(0,6));
            for(const file of scripts.slice(0,4)){
              const url=new URL(file,appURL);
              if(url.origin!==new URL(appURL).origin)continue;
              const body=await (await fetch(url)).text();
              console.log('JavaScript asset',file,'length',body.length);
              for(const needle of ['api-v2.appdeploy.ai','__appdeploy','apiBaseUrl','/api/large','x-appdeploy','apiBase','apiEndpoint']){
                const i=body.indexOf(needle);
                if(i>=0)console.log('Client SDK clue',needle,body.slice(Math.max(0,i-130),Math.min(body.length,i+250)));
              }
            }
          }
          if(!req.ok)process.exit(1);
          const status=JSON.parse(raw);
          if(!status?.providers?.r2){console.error('R2 bucket is not reachable');process.exit(1);}
          const gallery=await fetch(base+'?action=media');
          console.log('Gallery status:',gallery.status);
          if(!gallery.ok)process.exit(1);
          JS
      - name: Publish without affecting Vela
        run: |
          mkdir -p docs/aq
          find docs/aq -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R aquarium/dist/. docs/aq/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/aq
          if ! git diff --cached --quiet; then
            git commit -m "build(aquarium): publish independent GitHub gallery [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
