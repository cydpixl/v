name: Remove the two verified aquarium screenshots
on:
  push:
    paths:
      - '.github/workflows/aquarium-delete-screenshots-once.yml'
permissions:
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only two dimension-verified screenshot objects
        run: |
          node --input-type=module <<'JS'
          const host='https://newport-aquarium-r2-api.vercel.app';
          const response=await fetch(host+'/api/cleanup-screenshots',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({confirm:'delete-two-screen-captures-only'})
          });
          const body=await response.json();
          console.log('Screenshot cleanup HTTP:',response.status);
          console.log('Screenshot files removed:',body.deleted||[]);
          if(!response.ok||body.deletedCount!==2)throw Error(body.error||'The two screenshots were not deleted');
          const gallery=await fetch(host+'/api/gallery');
          if(!gallery.ok)throw Error('Gallery check failed after deletion');
          const data=await gallery.json();
          if((data.items||[]).some(x=>/IMG_(2580|3261)\.PNG$/i.test(x.name)))
            throw Error('Screenshot remains in the published gallery');
          console.log('Confirmed: both screenshot images are absent from the gallery');
          JS
