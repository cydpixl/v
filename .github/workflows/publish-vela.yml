name: Build and publish Vela frontend
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'scripts/build-github.mjs'
      - 'scripts/pwa-shell.mjs'
      - '.github/workflows/publish-vela.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vela-pages-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build and publish from newest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm run build:github
            git add docs
            if git diff --cached --quiet; then
              echo "Production assets are current."
              exit 0
            fi
            git commit -m "build(pages): publish latest Vela frontend [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Branch changed during build; retrying on newest main."
          done
          echo "Could not push after three attempts."
          exit 1
