name: Publish Daily Thoughts to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-daily-thoughts.mjs'
      - '.github/workflows/publish-daily-thoughts.yml'

permissions:
  contents: write

concurrency:
  group: daily-thoughts-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mirror existing production app
        run: node scripts/sync-daily-thoughts.mjs
      - name: Check username-only authentication
        run: node scripts/check-dt-account.mjs
      - name: Commit GitHub Pages files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/daily-thoughts docs/daily-thoughts
          if git diff --cached --quiet; then
            echo "Daily Thoughts assets are already current."
            exit 0
          fi
          git commit -m "build(pages): publish Daily Thoughts [skip ci]"
          git push origin HEAD:main
