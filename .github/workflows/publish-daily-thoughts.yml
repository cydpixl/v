name: Verify Daily Thoughts in Vela
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/daily-thoughts/**'
      - 'public/app-icons/daily-thoughts.svg'
      - 'src/daily-thoughts-app.*'
      - 'src/desktop-catalog.js'
      - 'src/hub.js'
      - 'scripts/check-dt-account.mjs'
      - 'scripts/verify-daily-thoughts.mjs'
      - '.github/workflows/publish-daily-thoughts.yml'

permissions:
  contents: read

concurrency:
  group: daily-thoughts-vela-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the bundled Daily Thoughts app
        run: node scripts/verify-daily-thoughts.mjs
      - name: Verify existing journal sign-in endpoint
        run: node scripts/check-dt-account.mjs
