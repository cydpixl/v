name: Create real aquarium video thumbnails
on:
  push:
    paths:
      - '.github/workflows/aquarium-video-posters.yml'
      - 'scripts/aquarium-posters.py'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
concurrency:
  group: newport-video-posters
  cancel-in-progress: false
jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install frame extraction tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Generate real still frames from public aquarium videos
        run: python3 scripts/aquarium-posters.py
      - name: Commit new static poster images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aquarium/public/posters/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "media(aquarium): add real video frame thumbnails"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
