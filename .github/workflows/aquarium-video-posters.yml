name: Create real aquarium video thumbnails
on:
  push:
    paths:
      - '.github/workflows/aquarium-video-posters.yml'
      - 'scripts/aquarium-posters.py'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: newport-video-posters
  cancel-in-progress: false
jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install frame extraction tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Generate real still frames from public aquarium videos
        run: python3 scripts/aquarium-posters.py
      - name: Publish only missing video thumbnails to live GitHub Pages
        run: |
          mkdir -p docs/aq/posters
          for poster in aquarium/public/posters/*.jpg; do
            [ -f "$poster" ] || continue
            file="${poster##*/}"
            if [ ! -s "docs/aq/posters/$file" ]; then
              cp "$poster" "docs/aq/posters/$file"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aquarium/public/posters/ docs/aq/posters/
          if ! git diff --cached --quiet; then
            git commit -m "media(aquarium): publish real video thumbnails to gallery [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
              sleep 3
            done
            echo "Failed to publish gallery thumbnails after retries" >&2
            exit 1
          fi
