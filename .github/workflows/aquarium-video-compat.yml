name: Convert aquarium videos for Chrome
on:
  push:
    branches: [main]
    paths:
      - 'scripts/aquarium-compatible-videos.py'
      - '.github/workflows/aquarium-video-compat.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: newport-chrome-compatible-videos
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1
      - name: Create H.264 video and AAC audio copies in R2
        env:
          MAX_VIDEOS: '30'
          MAX_ENCODE_SECONDS: '900'
        run: python3 scripts/aquarium-compatible-videos.py
