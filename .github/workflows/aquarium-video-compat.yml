name: Convert aquarium videos for Chrome
on:
  push:
    branches: [main]
    paths:
      - 'scripts/aquarium-compatible-videos.py'
      - '.github/workflows/aquarium-video-compat.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
  id-token: write
concurrency:
  group: newport-chrome-compatible-videos
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -hide_banner -version | head -n 1
      - name: Create H.264 video and AAC audio copies in R2
        env:
          MAX_VIDEOS: '30'
          MAX_ENCODE_SECONDS: '480'
          MAX_ATTEMPTS: '10'
        run: python3 scripts/aquarium-compatible-videos.py
      - name: Save real Chrome compatibility audit
        if: always()
        run: |
          mkdir -p reports
          if [ ! -s reports/aquarium-chrome-status.json ]; then
            echo '{"status":"workflow exited before the video audit was written"}' > reports/aquarium-chrome-status.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/aquarium-chrome-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(aquarium): record Chrome video conversion results [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase -X theirs origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            exit 1
          fi
