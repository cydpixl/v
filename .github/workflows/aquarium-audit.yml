name: Audit Aquarium Media
on:
  push:
    paths:
      - '.github/workflows/aquarium-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install image dimension inspection tool
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
      - name: Inventory gallery without modifying anything
        run: |
          node --input-type=module <<'JS'
          const base='https://newport-aquarium-r2-api.vercel.app/api/gallery';
          let nextToken='',items=[];
          for(let i=0;i<100;i++){
            const url=new URL(base);if(nextToken)url.searchParams.set('nextToken',nextToken);
            const res=await fetch(url);
            if(!res.ok)throw Error('Gallery returned HTTP '+res.status);
            const body=await res.json();
            items.push(...(body.items||[]));nextToken=body.nextToken||'';
            if(!nextToken)break;
          }
          const screenshots=items.filter(x=>/screen.?shot|capture d.ecran|screenshot|screen_record/i.test(x.name));
          const videos=items.filter(x=>x.kind==='video');
          console.log('Total:',items.length,'Video:',videos.length,'Images:',items.length-videos.length);
          console.log('Screenshot candidates:',JSON.stringify(screenshots.map(x=>({id:x.id,name:x.name,size:x.size}))));
          console.log('Video filenames:',JSON.stringify(videos.map(x=>({id:x.id,name:x.name,size:x.size,mime:x.mime}))));
          console.log('Image filenames:',JSON.stringify(items.filter(x=>x.kind==='image').map(x=>({id:x.id,name:x.name,size:x.size,mime:x.mime}))));
          for(const item of items.filter(x=>x.kind==='image'&&/\.png$/i.test(x.name))){
            const {spawnSync}=await import('node:child_process');
            const ff=spawnSync('ffprobe',['-v','error','-select_streams','v:0',
              '-show_entries','stream=width,height','-of','csv=p=0',item.url],{encoding:'utf8',timeout:35000});
            console.log('PNG candidate',JSON.stringify({id:item.id,name:item.name,size:item.size,
              dimensions:(ff.stdout||'').trim(),status:ff.status,error:ff.error?.code||''}));
          }
          JS
