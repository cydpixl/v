<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Newport Aquarium Visitor Archive — animal photos and videos">
  <title>Newport Aquarium Visitor Archive</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    html,body{overflow:hidden}
    /* Extend the embedded viewport below the visible page so platform-provided
       bottom-docked sharing controls remain out of view without covering content. */
    iframe{display:block;position:fixed;inset:0 auto auto 0;width:100%;height:calc(100vh + 108px);height:calc(100dvh + 108px);border:0;background:#000}
    .upload{position:fixed;right:26px;bottom:26px;z-index:2;display:flex;align-items:center;gap:10px;padding:13px 22px;border:1px solid #dce6e7;background:#f2f5f5;color:#090d0e;font-size:13px;font-weight:700;letter-spacing:.02em;text-decoration:none;box-shadow:0 6px 22px #0008;transition:transform .2s,background .2s}
    .upload:hover{background:#fff;transform:translateY(-2px)}
    .upload:focus-visible{outline:3px solid #e3f0ec;outline-offset:4px}
    .upload svg{flex:none}
    @media(max-width:700px){.upload{right:16px;bottom:18px;padding:12px 17px}}
  </style>
</head>
<body>
  <iframe id="gallery" title="Newport Aquarium animal gallery" src="about:blank" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; picture-in-picture" ></iframe>
  <a class="upload" href="https://newport-aquarium-visitor-archive-pdrkfz.v2.appdeploy.ai/#upload" title="Choose photos or videos to add">
    <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>
    Add
  </a>
  <script>
    (() => {
      const frame = document.getElementById('gallery');
      const storageKey = 'newport-archive-owner-link';
      const base = 'https://newport-aquarium-visitor-archive-pdrkfz.v2.appdeploy.ai/';
      const incoming = new URLSearchParams(location.hash.slice(1)).get('owner');
      if (incoming && /^[a-zA-Z0-9_-]{32,128}$/.test(incoming)) {
        try { localStorage.setItem(storageKey, incoming); } catch {}
        history.replaceState(null, '', location.pathname + location.search);
      }
      let ownerKey = incoming;
      if (!ownerKey) {
        try { ownerKey = localStorage.getItem(storageKey); } catch {}
      }
      frame.src = base + (ownerKey ? '#owner=' + encodeURIComponent(ownerKey) : '');
    })();
  </script>
</body>
</html>
