<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Aquarium video</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:18px}video{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100dvh - 90px);background:#000;object-fit:contain}#status{max-width:500px;text-align:center;font-size:14px;line-height:1.55;color:#c9c9c9}#title{font-size:13px;color:#a5a5a5;overflow-wrap:anywhere;text-align:center}button{background:#222;color:#fff;border:1px solid #444;padding:10px 14px;font:inherit;cursor:pointer}button:hover{background:#333}</style></head><body>
<main><div id="title"></div><div id="status">Loading video…</div><video id="player" playsinline controls preload="metadata" style="display:none" aria-label="Shared Aquarium video"></video><button type="button" id="retry" style="display:none">Try again</button></main>
<script>
(() => {
  const key = new URLSearchParams(location.search).get('id') || '';
  const status = document.querySelector('#status');
  const video = document.querySelector('#player');
  const title = document.querySelector('#title');
  const retry = document.querySelector('#retry');
  const api = 'https://newport-aquarium-r2-api.vercel.app/api/share?id=' + encodeURIComponent(key);
  let lastUrl = '', retries = 0, refreshing = false;
  if(!/^visitor\/[A-Za-z0-9._-]+\.(mov|mp4|m4v|webm)$/i.test(key)){
    status.textContent = 'Invalid video link.'; return;
  }
  title.textContent = key.split('/').pop();
  document.title = title.textContent + ' · Aquarium';
  function state(text, showRetry=false) {
    status.textContent = text;
    status.style.display='block';
    retry.style.display=showRetry?'block':'none';
  }
  async function refresh(){
    if(refreshing)return;
    refreshing=true;
    try{
      const res=await fetch(api,{cache:'no-store',credentials:'omit'});
      if(!res.ok)throw Error('The video could not be retrieved ('+res.status+').');
      const data=await res.json();
      const ready=Boolean(data.browserReady);
      const url=String(data.url||'');
      if(!ready || !url){
        video.style.display='none';
        state('Preparing a Chrome-compatible video with sound. This page will update automatically.');
        if(retries++ < 120)setTimeout(refresh,15000);
        return;
      }
      retries=0;
      if(url!==lastUrl){
        lastUrl=url;
        video.pause();
        video.src=url;
        video.load();
      }
      video.style.display='block';
      status.style.display='none'; retry.style.display='none';
    }catch(e){
      state((e&&e.message)||'This video is temporarily unavailable.',true);
    }finally{refreshing=false;}
  }
  video.addEventListener('error',()=>{state('The video could not be played. Try reloading the compatible version.',true);});
  retry.addEventListener('click',()=>{retries=0;refresh();});
  // Refresh expiring R2 playback URLs if the tab stays open.
  video.addEventListener('stalled',()=>{if(video.networkState===3)refresh();});
  refresh();
})();
</script></body></html>
